<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalles - Mi Videoteca</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { background-color: #141414; color: white; font-family: Arial, sans-serif; margin: 0; }
        
        .detalle-container { 
            display: flex; 
            flex-wrap: wrap; 
            gap: 30px; 
            padding: 20px; 
            max-width: 1000px; 
            margin: 40px auto; 
        }

        .poster-detalle { 
            width: 100%; 
            max-width: 350px; 
            border-radius: 15px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.8); 
            object-fit: cover;
        }

        .texto-detalle { flex: 1; min-width: 320px; }

        .boton-volver { 
            display: inline-block; 
            margin-bottom: 20px; 
            color: #e50914; 
            text-decoration: none; 
            font-weight: bold; 
            font-size: 1.1rem;
        }

        h1 { font-size: 2.5rem; margin: 10px 0; }

        .sinopsis { line-height: 1.6; color: #ccc; font-size: 1.1rem; }

        /* --- SECCIÓN DE PLATAFORMAS OPTIMIZADA --- */
        .plataformas { 
            margin-top: 30px; 
            background: #1f1f1f; 
            padding: 20px; 
            border-radius: 12px;
            border: 1px solid #333;
        }

        .plataformas h3 { 
            font-size: 0.85rem; 
            margin-bottom: 15px; 
            color: #e50914; 
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .logos-container { 
            display: flex; 
            gap: 12px; 
            flex-wrap: wrap; 
        }

        .logo-plataforma { 
            width: 55px; 
            height: 55px; 
            border-radius: 12px; 
            object-fit: contain; 
            background: white; /* Fondo blanco para resaltar logos transparentes */
            padding: 5px; /* Espaciado interno para que el logo no toque los bordes */
            border: 2px solid #444;
            transition: transform 0.2s, border-color 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .logo-plataforma:hover {
            transform: scale(1.1);
            border-color: #e50914;
        }

        .link-trailer { 
            display: inline-block; 
            margin-top: 25px; 
            padding: 12px 25px; 
            background: #e50914; 
            color: white; 
            text-decoration: none; 
            border-radius: 5px; 
            font-weight: bold;
            transition: background 0.3s;
        }

        .link-trailer:hover { background: #b20710; }

        .error-msg { color: #aaa; font-style: italic; margin-top: 10px; }
    </style>
</head>
<body>
    <div id="contenido-detalle" class="detalle-container">Cargando experiencia...</div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');
        const tipo = params.get('tipo');
        const API_KEY = '7d58ecd9d52094c0cb6f1bd55c6d6a88'; // <--- ASEGÚRATE DE PONER TU KEY REAL

        async function cargarDetalle() {
            try {
                // 1. Datos básicos
                const resDet = await fetch(`https://api.themoviedb.org/3/${tipo}/${id}?api_key=${API_KEY}&language=es-ES`);
                const item = await resDet.json();
                
                // 2. Tráiler
                const resVid = await fetch(`https://api.themoviedb.org/3/${tipo}/${id}/videos?api_key=${API_KEY}&language=es-ES`);
                const vidData = await resVid.json();
                let trailer = vidData.results.find(v => v.type === 'Trailer' && v.site === 'YouTube');

                if (!trailer) {
                    const resVidAlt = await fetch(`https://api.themoviedb.org/3/${tipo}/${id}/videos?api_key=${API_KEY}`);
                    const vidDataAlt = await resVidAlt.json();
                    trailer = vidDataAlt.results.find(v => v.type === 'Trailer' && v.site === 'YouTube');
                }

                // 3. Plataformas en España
                const resProv = await fetch(`https://api.themoviedb.org/3/${tipo}/${id}/watch/providers?api_key=${API_KEY}`);
                const provData = await resProv.json();
                const proveedoresES = provData.results?.ES?.flatrate || [];

                let htmlPlataformas = "";
                if (proveedoresES.length > 0) {
                    htmlPlataformas = `
                        <div class="plataformas">
                            <h3>Disponible en tus suscripciones:</h3>
                            <div class="logos-container">
                                ${proveedoresES.map(p => `
                                    <img src="https://image.tmdb.org/t/p/original${p.logo_path}" 
                                         class="logo-plataforma" 
                                         title="${p.provider_name}" 
                                         alt="${p.provider_name}">
                                `).join('')}
                            </div>
                        </div>
                    `;
                } else {
                    htmlPlataformas = `
                        <div class="plataformas">
                            <h3>No disponible en suscripción (España)</h3>
                            <p class="error-msg">Podría estar disponible solo para alquiler o compra.</p>
                        </div>
                    `;
                }

                document.getElementById('contenido-detalle').innerHTML = `
                    <img src="https://image.tmdb.org/t/p/w500${item.poster_path}" alt="Poster" class="poster-detalle">
                    <div class="texto-detalle">
                        <a href="index.html" class="boton-volver">← Volver al catálogo</a>
                        <h1>${item.title || item.name}</h1>
                        <p class="sinopsis"><strong>Sinopsis:</strong> ${item.overview || 'Lo sentimos, no hay una sinopsis disponible en castellano para este título.'}</p>
                        <p><strong>Puntuación:</strong> ⭐ ${item.vote_average.toFixed(1)} / 10</p>
                        
                        ${htmlPlataformas}

                        ${trailer ? 
                            `<a href="https://www.youtube.com/watch?v=${trailer.key}" target="_blank" class="link-trailer">📺 Ver Tráiler Oficial</a>` 
                            : '<p class="error-msg">Tráiler no disponible para este título.</p>'}
                    </div>
                `;
            } catch (e) { 
                document.getElementById('contenido-detalle').innerHTML = "<h2>Error al cargar los datos</h2><p>Revisa tu conexión o la API KEY.</p>"; 
            }
        }
        cargarDetalle();
    </script>
</body>
</html>
