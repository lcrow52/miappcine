<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalles - Mi Videoteca</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .detalle-container { display: flex; flex-wrap: wrap; gap: 30px; padding: 20px; max-width: 900px; margin: auto; }
        .detalle-container img { width: 100%; max-width: 300px; border-radius: 10px; }
        .texto-detalle { flex: 1; min-width: 300px; }
        .boton-volver { display: inline-block; margin-bottom: 20px; color: #e50914; text-decoration: none; font-weight: bold; }
        .link-trailer { display: inline-block; margin-top: 15px; padding: 10px 20px; background: #e50914; color: white; text-decoration: none; border-radius: 5px; }
    </style>
</head>
<body>
    <div id="contenido-detalle" class="detalle-container">Cargando...</div>
    <script>
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');
        const tipo = params.get('tipo');
        const API_KEY = '7d58ecd9d52094c0cb6f1bd55c6d6a88';

        async function cargarDetalle() {
            try {
                const resDet = await fetch(`https://api.themoviedb.org/3/${tipo}/${id}?api_key=${API_KEY}&language=es-ES`);
                const item = await resDet.json();
                
                const resVid = await fetch(`https://api.themoviedb.org/3/${tipo}/${id}/videos?api_key=${API_KEY}&language=es-ES`);
                const vidData = await resVid.json();
                let trailer = vidData.results.find(v => v.type === 'Trailer' && v.site === 'YouTube');

                if (!trailer) {
                    const resVidOrg = await fetch(`https://api.themoviedb.org/3/${tipo}/${id}/videos?api_key=${API_KEY}`);
                    const vidDataOrg = await resVidOrg.json();
                    trailer = vidDataOrg.results.find(v => v.type === 'Trailer' && v.site === 'YouTube');
                }

                document.getElementById('contenido-detalle').innerHTML = `
                    <img src="https://image.tmdb.org/t/p/w500${item.poster_path}" alt="Poster">
                    <div class="texto-detalle">
                        <a href="index.html" class="boton-volver">← Volver</a>
                        <h1>${item.title || item.name}</h1>
                        <p><strong>Sinopsis:</strong> ${item.overview || 'Sin descripción.'}</p>
                        <p><strong>Puntuación:</strong> ⭐ ${item.vote_average.toFixed(1)}</p>
                        ${trailer ? `<a href="https://www.youtube.com/watch?v=${trailer.key}" target="_blank" class="link-trailer">📺 Ver Tráiler</a>` : '<p>Tráiler no disponible</p>'}
                    </div>
                `;
            } catch (e) { document.getElementById('contenido-detalle').innerHTML = "Error al cargar."; }
        }
        cargarDetalle();
    </script>
</body>
</html>
