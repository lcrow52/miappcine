<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Videoteca Pro</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Feedback visual para filtros activos */
        .btn-tipo.activo {
            background-color: #e50914 !important;
            color: white !important;
            font-weight: bold;
            box-shadow: 0 0 15px rgba(229, 9, 20, 0.4);
            border: 1px solid white;
        }

        .filtros {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            padding: 20px;
            background: #000;
        }

        .controles-tipo {
            display: flex;
            gap: 5px;
            margin-bottom: 10px;
            width: 100%;
            justify-content: center;
        }

        .buscador-container {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-bottom: 10px;
        }

        #input-busqueda {
            width: 70%;
            max-width: 400px;
            padding: 12px;
            border-radius: 25px 0 0 25px;
            border: none;
            background: #222;
            color: white;
        }

        .btn-buscar {
            padding: 12px 20px;
            border-radius: 0 25px 25px 0;
            border: none;
            background: #e50914;
            color: white;
            cursor: pointer;
        }

        select, .btn-tipo, .btn-reset {
            padding: 10px 15px;
            border-radius: 5px;
            border: 1px solid #333;
            background: #222;
            color: white;
            cursor: pointer;
        }

        .btn-reset {
            background: #444;
            border-color: #555;
        }

        .btn-reset:hover { background: #555; }
    </style>
</head>
<body>
    <header>
        <h1 id="titulo-seccion" style="text-align: center; color: #e50914; margin-top: 20px;">Cine y Series</h1>
        
        <nav class="filtros">
            <div class="buscador-container">
                <input type="text" id="input-busqueda" placeholder="Buscar título..." onkeyup="if(event.key === 'Enter') ejecutarBusqueda()">
                <button class="btn-buscar" onclick="ejecutarBusqueda()">🔍</button>
            </div>

            <div class="controles-tipo">
                <button id="btn-movie" class="btn-tipo" onclick="cambiarTipo('movie')">Películas</button>
                <button id="btn-tv" class="btn-tipo" onclick="cambiarTipo('tv')">Series</button>
                <button id="btn-both" class="btn-tipo" onclick="cambiarTipo('both')">Todo</button>
            </div>
            
            <select id="desplegable-generos" onchange="ejecutarFiltros()">
                <option value="">Todos los géneros</option>
            </select>

            <select id="desplegable-anios" onchange="ejecutarFiltros()">
                <option value="">Año (Todos)</option>
            </select>

            <select id="desplegable-vistas" onchange="ejecutarFiltros()">
                <option value="todas">Vistas/Pendientes</option>
                <option value="vistas">Solo Vistas</option>
                <option value="no-vistas">Solo Pendientes</option>
            </select>

            <select id="desplegable-favoritos" onchange="ejecutarFiltros()">
                <option value="todos">Todos los títulos</option>
                <option value="solo-favoritos">❤️ Favoritos</option>
            </select>

            <button class="btn-reset" onclick="reiniciarFiltros()">Reiniciar Filtros</button>
        </nav>
    </header>

    <main id="contenedor-principal" class="grid-pelis">
        </main>

    <div style="text-align: center; padding: 40px;">
        <button id="btn-cargar-mas" onclick="siguientePagina()" style="background: #e50914; color: white; border: none; padding: 15px 40px; border-radius: 30px; cursor: pointer; font-weight: bold;">
            Ver más resultados
        </button>
    </div>

    <script src="script.js"></script>
</body>
</html>
