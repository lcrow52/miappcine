<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Videoteca Pro</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#e50914">
</head>
<body>
    <header>
        <h1 id="titulo-seccion">Películas</h1>
        <nav class="filtros">
            <button onclick="cambiarTipo('movie')">Películas</button>
            <button onclick="cambiarTipo('tv')">Series</button>
            
            <select id="desplegable-generos" onchange="ejecutarFiltros()">
                <option value="">Cargando géneros...</option>
            </select>

            <select id="desplegable-anios" onchange="ejecutarFiltros()">
                <option value="">Año (Todos)</option>
            </select>

            <select id="desplegable-vistas" onchange="ejecutarFiltros()">
                <option value="todas">Vistas/Pendientes</option>
                <option value="vistas">Solo Vistas</option>
                <option value="no-vistas">Solo Pendientes</option>
            </select>

            <select id="desplegable-favoritos" onchange="ejecutarFiltros()">
                <option value="todos">Todos los títulos</option>
                <option value="solo-favoritos">❤️ Favoritos</option>
            </select>
        </nav>
    </header>

    <main id="contenedor-principal" class="grid-pelis">
        </main>

    <div style="text-align: center; padding: 40px;">
        <button id="btn-cargar-mas" onclick="siguientePagina()" style="background: #e50914; color: white; border: none; padding: 15px 40px; border-radius: 30px; cursor: pointer; font-weight: bold;">
            Cargar más resultados
        </button>
    </div>

    <script src="script.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
